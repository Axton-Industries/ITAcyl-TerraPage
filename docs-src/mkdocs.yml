site_name: Terra — Documentación
site_description: Guía de usuario y referencia técnica de Terra, aplicación de gestión agrícola con visor geográfico.
site_url: https://axton-industries.github.io/ITAcyl-TerraPage/docs/
site_author: ITACyL

repo_name: Axton-Industries/ITAcyl-TerraPage
repo_url: https://github.com/Axton-Industries/ITAcyl-TerraPage
edit_uri: ""

docs_dir: .
site_dir: ../docs

theme:
  name: material
  language: es
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - content.action.view
    - announce.dismiss
  icon:
    repo: fontawesome/brands/github
  logo: assets/terra-logo.svg
  favicon: assets/terra-favicon.svg
  extra:
    social:
      - icon: fontawesome/brands/github
        link: https://github.com/Axton-Industries/ITAcyl-TerraPage
        name: Repositorio en GitHub

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Axton-Industries/ITAcyl-TerraPage
      name: Terra en GitHub

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/brand-link.js
  - assets/fix-indeterminate.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.smartsymbols

plugins:
  - search
  - tags

nav:
  - Inicio: index.md
  - Empezar:
      - Inicio rápido: inicio-rapido.md
      - Despliegue: despliegue.md
  - Tutoriales:
      - Navegar por el mapa: tutorials/navegar-mapa.md
      - Comparar el mapa (split / swipe): tutorials/comparar-mapa.md
      - Crear un cultivo: tutorials/crear-cultivo.md
      - Registrar actuaciones: tutorials/crear-actuacion.md
      - Gestionar maquinaria: tutorials/maquinaria.md
      - Muestras de suelo: tutorials/muestras-suelo.md
      - Calendario: tutorials/calendario.md
      - Gestión de riego: tutorials/gestion-riego.md
      - Deshacer global y atajos: tutorials/atajos-deshacer.md
  - Guía de usuario:
      - Módulos: modulos.md
      - Roles y permisos: roles.md
      - Formatos vectoriales: formatos.md
  - Referencia técnica:
      - Pila técnica: pila-tecnica.md
      - API REST: api.md
      - Variables de entorno: env.md
      - Almacenamiento y SIGPAC: almacenamiento.md
