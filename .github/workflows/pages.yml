name: Deploy landing + docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs Material
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Build docs site
        # Build the MkDocs site directly into the repo's docs/ folder so
        # GitHub Pages serves it at /docs/ without any extra wrapper dir.
        run: mkdocs build -f docs-src/mkdocs.yml --strict

      - name: Inject latest Terra download URL
        env:
          GH_TOKEN: ${{ secrets.TERRA_TOKEN }}
        run: |
          EXE_URL=$(curl -sL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Axton-Industries/ITAcyl-Terra/releases/latest" \
          | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for a in data.get('assets', []):
              if a['name'].endswith('.exe'):
                  print(a['browser_download_url']); break
          ")
          if [ -n "$EXE_URL" ]; then
            echo "Latest .exe URL: $EXE_URL"
            sed -i "s|__TERRA_EXE_URL__|${EXE_URL}|g" index.html
          else
            echo "::warning::Could not fetch .exe URL — falling back to releases page"
            sed -i "s|__TERRA_EXE_URL__|https://github.com/Axton-Industries/ITAcyl-Terra/releases/latest|g" index.html
          fi

      - name: Commit built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: rebuild docs site [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
