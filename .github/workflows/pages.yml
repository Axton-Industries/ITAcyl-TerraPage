name: Deploy landing + docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs Material
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Build docs site
        run: mkdocs build -f docs/mkdocs.yml --strict

      - name: Compose Pages artifact
        run: |
          mkdir -p _pages/docs
          # Landing at /
          cp index.html _pages/index.html
          cp styles.css _pages/styles.css
          cp main.js _pages/main.js
          cp -r assets _pages/assets
          # Docs site at /docs/
          cp -r site/. _pages/docs/

      - name: Disable Jekyll on Pages
        run: touch _pages/.nojekyll

      - name: Commit built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A _pages/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: rebuild docs site [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
